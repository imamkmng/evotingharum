<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Text Paths for Circular Text -->
    <path id="textPathTop" d="M 68 250 A 182 182 0 0 1 432 250" fill="none" />
    <path id="textPathBottom" d="M 432 250 A 182 182 0 0 1 68 250" fill="none" />
  </defs>

  <style>
    .brand-red { fill: #D32424; }
    .brand-white { fill: #FFFFFF; }
    .stroke-white { stroke: #FFFFFF; stroke-width: 10; stroke-linejoin: round; stroke-linecap: round; }
    .text-top { font-family: 'Poppins', 'Montserrat', 'Arial Black', sans-serif; font-weight: 900; font-size: 29px; fill: #FFFFFF; letter-spacing: 5px; }
    .text-bottom { font-family: 'Poppins', 'Montserrat', 'Arial Black', sans-serif; font-weight: 900; font-size: 25.5px; fill: #FFFFFF; letter-spacing: 3.8px; }
    .text-harum { font-family: 'Poppins', 'Montserrat', 'Arial Black', sans-serif; font-weight: 900; font-size: 34px; fill: #FFFFFF; letter-spacing: 7px; }
  </style>

  <!-- 1. Outer Circle -->
  <circle cx="250" cy="250" r="242" class="brand-red" />
  <circle cx="250" cy="250" r="240" fill="none" stroke="#D32424" stroke-width="2" />

  <!-- 2. Circular Text: SEKOLAH ISLAM TERPADU (Top) -->
  <text class="text-top">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      SEKOLAH ISLAM TERPADU
    </textPath>
  </text>

  <!-- Stars on sides -->
  <text x="32" y="258" font-size="28" fill="#FFFFFF" font-family="'Arial Black', sans-serif" text-anchor="middle">★</text>
  <text x="468" y="258" font-size="28" fill="#FFFFFF" font-family="'Arial Black', sans-serif" text-anchor="middle">★</text>

  <!-- 3. Circular Text: HARAPAN UMAT - KARAWANG (Bottom) -->
  <text class="text-bottom">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      HARAPAN UMAT - KARAWANG
    </textPath>
  </text>

  <!-- 4. Inner Ring White Border -->
  <circle cx="250" cy="250" r="192" fill="none" stroke="#FFFFFF" stroke-width="7" />

  <!-- 5. 8-Pointed Star (Rub el Hizb) Background Layer -->
  <!-- Square 1 (0 deg) -->
  <rect x="135" y="135" width="230" height="230" rx="6" class="brand-red" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="miter" />
  <!-- Square 2 (45 deg) -->
  <rect x="135" y="135" width="230" height="230" rx="6" class="brand-red" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="miter" transform="rotate(45 250 250)" />

  <!-- Fill Star Center to hide overlapping strokes -->
  <rect x="142" y="142" width="216" height="216" rx="4" class="brand-red" />
  <rect x="142" y="142" width="216" height="216" rx="4" class="brand-red" transform="rotate(45 250 250)" />

  <!-- 6. Inner Arch Frame -->
  <path d="M 152 308 A 108 108 0 1 1 348 308 Z" fill="none" stroke="#FFFFFF" stroke-width="6.5" />

  <!-- 7. Mosque Dome & Minaret Silhouette -->
  <!-- Minaret on the right -->
  <path d="M 288 260 L 288 185 Q 294 180 294 172 Q 294 165 300 162 Q 306 165 306 172 Q 306 180 312 185 L 312 260 Z" class="brand-white" />
  <!-- Crescent on top of Minaret -->
  <path d="M 299 155 A 7 7 0 1 0 306 143 A 5.5 5.5 0 1 1 299 155 Z" class="brand-white" />

  <!-- Main Mosque Dome Silhouette -->
  <path d="M 194 262 C 194 206, 230 188, 250 184 C 270 188, 306 206, 306 262 Z" class="brand-white" />

  <!-- Small Dome Finial -->
  <path d="M 248 184 L 252 184 L 250 176 Z" class="brand-white" />

  <!-- 8. Open Quran Book Silhouette -->
  <path d="M 160 266 
           C 195 264, 230 274, 250 286 
           C 270 274, 305 264, 340 266 
           L 348 306 
           C 310 303, 275 314, 250 326 
           C 225 314, 190 303, 152 306 
           Z" class="brand-white" />
  
  <!-- Quran Book Spine Center Dot / Accent -->
  <circle cx="250" cy="306" r="6" class="brand-red" />
  <path d="M 250 288 L 250 326" stroke="#D32424" stroke-width="3.5" />

  <!-- Base Line under Book -->
  <path d="M 150 312 L 350 312" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />

  <!-- 9. "HARUM" Center Plaque Banner -->
  <rect x="138" y="324" width="224" height="42" rx="4" class="brand-red" stroke="#FFFFFF" stroke-width="7" />
  <text x="250" y="356" text-anchor="middle" class="text-harum font-bold">HARUM</text>

</svg>
